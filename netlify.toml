[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin", "visitor"]}

# Keep the SPA fallback but ensure static assets and functions are served first
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
