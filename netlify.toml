[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 1. API proxy redirect (more specific, must be evaluated first!)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. SPA fallback (catch-all, must be evaluated last!)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

