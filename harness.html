<!doctype html><html><head><meta charset="utf-8"></head>
<body style="margin:0"><div id="root"></div><pre id="measure"></pre>
<script type="module" src="/harness.jsx"></script>
<script>
setTimeout(() => {
  const bad = [];
  for (const el of document.querySelectorAll('select, span, button, div')) {
    const over = el.scrollWidth - el.clientWidth;
    if (over > 1 && el.clientWidth > 0 && el.children.length === 0) {
      bad.push(`OVERFLOW ${over}px  client=${el.clientWidth} need=${el.scrollWidth}  "${(el.textContent||el.value||'').trim().slice(0,30)}"`);
    }
  }
  // <select> never reports scrollWidth overflow, so measure its longest option against its own box.
  const ctx = document.createElement('canvas').getContext('2d');
  for (const sel of document.querySelectorAll('select')) {
    const cs = getComputedStyle(sel);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const longest = [...sel.options].reduce((a,o)=> ctx.measureText(o.textContent.trim()).width > ctx.measureText(a).width ? o.textContent.trim() : a, '');
    const need = Math.ceil(ctx.measureText(longest).width);
    const avail = Math.floor(sel.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
    const cur = Math.ceil(ctx.measureText(sel.options[sel.selectedIndex]?.textContent.trim()||'').width);
    bad.push(`SELECT minW=${cs.minWidth} flexBasis=${cs.flexBasis} offW=${sel.offsetWidth} avail=${avail}  current="${(sel.options[sel.selectedIndex]?.textContent||'').trim().slice(0,28)}" needs=${cur} ${cur>avail?'<<< CLIPPED':'ok'}  longestOption="${longest.slice(0,26)}" needs=${need} ${need>avail?'<<< CLIPPED':'ok'}`);
  }
  const panels = [...document.querySelectorAll('.flex-wrap > div')]
    .map(d => `PANEL ${Math.round(d.getBoundingClientRect().width)}px  top=${Math.round(d.getBoundingClientRect().top)}  "${d.textContent.trim().slice(0,16)}"`);
  document.getElementById('measure').textContent = [...panels, '', ...bad].join('\n');
}, 1200);
</script></body></html>
